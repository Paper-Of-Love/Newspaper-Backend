app = "paper-of-love-backend"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"
  NODE_ENV = "production"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
